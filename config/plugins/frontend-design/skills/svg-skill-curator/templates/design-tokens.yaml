# config/skills/svg-skill-curator/templates/design-tokens.yaml
# Project-Local SVG Design Tokens Baseline Contract
# Governed by svg-skill-curator. Preserved on version sync.

name: default-project-theme
aspectRatio: "16:9"

canvas:
  width: 1200
  height: 675
  padding: 40

palette:
  primary: "#3b82f6"
  primaryHover: "#60a5fa"
  bgBase: "#0f172a"
  bgCard: "#1e293b"
  borderCard: "#334155"
  textMain: "#f8fafc"
  textSecondary: "#94a3b8"
  accent: "#10b981"

typography:
  fontFamilyBase: '"Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif'
  scale:
    floor: "12px"      # 生理可读性硬性底线 (严禁配置低于 12px)
    sm: "14px"         # 次要正文与列表项
    base: "16px"       # 标准卡片正文与属性名
    lg: "18px"         # 卡片分组标题
    xl: "24px"         # 架构分层大标题
    hero: "32px"       # 图表主标题
  leading:
    tight: 1.25
    normal: 1.35       # 推荐 tspan dy 相对行距
    relaxed: 1.5

card:
  rx: 8
  strokeWidth: 1.5
  paddingInner: 16

exemptions:
  allowMicroFontForSparklines: true
  exemptionAttribute: "data-allow-micro-font"
